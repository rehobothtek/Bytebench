{% extends 'base.html' %}
{% block title %}Password updated — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="section">
  <div class="wrap" style="max-width:460px;">
    <h1 class="page-title" style="margin-bottom:12px;">Password updated</h1>
    <p style="color:var(--text-dim); font-size:14.5px; margin-bottom:28px;">Your new password is set. Log in with it and everything — cart, saved details, order history — is exactly where you left it.</p>
    <a class="btn btn-primary" href="{% url 'login' %}">Log in →</a>
  </div>
</section>
{% endblock %}
